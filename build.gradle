        projecte {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.api)
        }
    }

    runs {
        configureEach {
            if (project.hasProperty('forge_force_ansi')) {
                property('terminal.ansi', (String) project.property('forge_force_ansi'))
            }
            property('projecte.skip_top', 'true')
            if (javaToolchains.launcherFor(java.toolchain).map { it.metadata.vendor }.getOrElse('').contains('JetBrains')) {
                vmArgs('-XX:+IgnoreUnrecognizedVMOptions', '-XX:+AllowEnhancedClassRedefinition')
            }
        }
        client {
            client()
            configName = 'Fabric Client'
        }
        clientAlt {
            client()
            configName = 'Fabric Client Alt'
            programArgs('--username', 'AltDev')
        }
        server {
            server()
            configName = 'Fabric Server'
            programArg('--nogui')
        }
    }
}

sourceSets.api.compileClasspath += configurations.compileClasspath

static void exclusiveRepo(RepositoryHandler handler, String url, String... groups) {
    exclusiveRepo(handler, url, filter -> {
        for (def group : groups) {
            filter.includeGroup(group)
        }
    })
}

static void exclusiveRepo(RepositoryHandler handler, String url, Consumer<InclusiveRepositoryContentDescriptor> filterSetup) {
    handler.exclusiveContent {
        it.forRepositories(handler.maven {
            setUrl(url)
        })
        it.filter { f -> filterSetup.accept(f) }
    }
}

repositories { RepositoryHandler handler ->
    mavenCentral()
    exclusiveRepo(handler, 'https://maven.parchmentmc.org', filter -> {
        filter.includeGroupAndSubgroups('org.parchmentmc')
    })
    exclusiveRepo(handler, 'https://maven.blamejared.com', 'mezz.jei')
    exclusiveRepo(handler, 'https://maven.terraformersmc.com/', 'dev.emi')
    exclusiveRepo(handler, 'https://maven.shedaniel.me/', 'me.shedaniel', 'me.shedaniel.cloth')
    exclusiveRepo(handler, 'https://maven.architectury.dev/', 'dev.architectury')
    exclusiveRepo(handler, 'https://maven.ladysnake.org/releases', filter -> {
        filter.includeGroupAndSubgroups('org.ladysnake')
    })
    exclusiveRepo(handler, 'https://maven2.bai.lol', 'lol.bai', 'mcp.mobius.waila')
    exclusiveRepo(handler, 'https://api.modrinth.com/maven', 'maven.modrinth')
    exclusiveRepo(handler, 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/', filter -> {
        filter.includeGroupAndSubgroups('fuzs.forgeconfigapiport')
